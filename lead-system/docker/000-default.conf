# Every request goes through the PHP front controller (api/router.php),
# which serves the SPA/static files from public/ and the JSON API, with the
# security headers applied in one place. APACHE_PORT is replaced at start.
<VirtualHost *:APACHE_PORT>
    DocumentRoot /app

    <Directory /app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Pass the HTTP Authorization header through to PHP (Apache strips it
        # by default, which would 401 every authenticated API request).
        CGIPassAuth On
    </Directory>

    # Belt-and-suspenders: expose Authorization to PHP as $_SERVER even on
    # Apache builds where CGIPassAuth isn't honored for the module.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    RewriteEngine On
    # Every request is routed to the front controller (which serves the SPA +
    # API and applies security headers). Source files are therefore never
    # served raw: a request for /api/leads.php is routed to router.php, which
    # only recognizes real API routes and 404s anything else.
    RewriteCond %{REQUEST_URI} !^/api/router\.php$
    RewriteRule ^ /api/router.php [L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
