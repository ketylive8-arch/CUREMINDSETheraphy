<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 384" role="img" aria-label="CureMindset — By Kety Segev">
  <defs>
    <linearGradient id="cmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C579"/>
      <stop offset="55%" stop-color="#C79A3E"/>
      <stop offset="100%" stop-color="#9E7620"/>
    </linearGradient>
  </defs>

  <!-- Brain + heart mark -->
  <g transform="translate(170 104)">
    <g fill="none" stroke="url(#cmGold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <!-- outer brain silhouette -->
      <path d="M-6 -74
               C-34 -84 -70 -66 -70 -36
               C-92 -30 -92 2 -72 12
               C-84 34 -64 60 -40 54
               C-34 74 -6 78 6 62" />
      <path d="M6 -74
               C34 -84 70 -66 70 -36
               C92 -30 92 2 72 12
               C84 34 64 60 40 54
               C34 74 6 78 6 62" />
      <!-- central fissure + a few gyri -->
      <path d="M6 -70 V60" />
      <path d="M-46 -40 q22 6 6 30" />
      <path d="M-40 6 q20 8 2 28" />
      <path d="M40 -46 q-22 8 -4 30" />
    </g>
    <!-- heart nested in the right lobe -->
    <path d="M40 -20 c-13 -15 -34 -3 -22 14 c6 9 22 20 22 20 c0 0 16 -11 22 -20 c12 -17 -9 -29 -22 -14 z"
          fill="url(#cmGold)" />
  </g>

  <!-- Wordmark -->
  <text x="170" y="266" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="50" font-weight="700" letter-spacing="1" fill="#4b4640">Curemindset</text>
  <line x1="104" y1="288" x2="236" y2="288" stroke="#d9cdb2" stroke-width="3" stroke-linecap="round" />
  <text x="170" y="318" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#111">By</text>
  <text x="170" y="360" text-anchor="middle" font-family="'Segoe Script','Brush Script MT',cursive" font-size="34" font-style="italic" fill="#1a1a1a">Kety Segev</text>
</svg>
