<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>קונסולת לידים</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FAF8F4; --cream-2:#F3EEE4; --surface:#FFFFFF; --line:#ECE4D8; --line-2:#E3E7F0;
    --ink:#2D2A26; --ink-500:#6B6560; --ink-300:#9B958F;
    --gold:#C9A96E; --gold-deep:#B5892F; --gold-soft:#EFE3CC;
    --navy:#20283F; --navy-2:#2B3450; --blue:#B8D4E3;
    --green:#16A34A; --green-bg:#E7F3EB; --amber:#B9791A; --amber-bg:#F7EEDC;
    --rose:#C23A2B; --rose-bg:#F7E3E0;
    --shadow:0 1px 2px rgba(45,42,38,.05),0 12px 30px -16px rgba(45,42,38,.2);
    --shadow-lg:0 30px 60px -28px rgba(45,42,38,.45);
    --radius:16px; --radius-sm:11px;
  }
  @media (prefers-color-scheme:dark){:root{
    --cream:#101017; --cream-2:#15151D; --surface:#1B1B24; --line:#2C2A33; --line-2:#2C2A33;
    --ink:#F0ECE4; --ink-500:#B2ADA4; --ink-300:#827D74;
    --gold:#D8BC85; --gold-deep:#C9A96E; --gold-soft:#36301F;
    --navy:#0C0C12; --navy-2:#171720; --blue:#8FB6CA;
    --green:#5BBE7D; --green-bg:#16301E; --amber:#D8A245; --amber-bg:#2E2716;
    --rose:#E08072; --rose-bg:#2E1C19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.6);
    --shadow-lg:0 30px 60px -24px rgba(0,0,0,.7);
  }}
  *{box-sizing:border-box}html,body{margin:0}
  body{direction:rtl;background:var(--cream);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Frank Ruhl Libre',serif;margin:0}
  .btn{border:0;border-radius:999px;padding:11px 20px;font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;transition:transform .08s,box-shadow .2s,background .2s,filter .2s;min-height:44px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#2b2206;box-shadow:0 8px 20px -10px var(--gold-deep)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.primary:disabled{background:var(--line);color:var(--ink-300);cursor:not-allowed;box-shadow:none}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-500)}
  .btn.ghost:hover{border-color:var(--gold);color:var(--ink)}
  .btn.sm{padding:8px 14px;min-height:38px;font-size:13px}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-500);margin-bottom:5px}
  input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;width:100%;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 26%,transparent)}
  input[dir=ltr]{direction:ltr;text-align:left}
  textarea{min-height:150px;line-height:1.7;resize:vertical}

  /* AUTH */
  .authwrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:
     radial-gradient(900px 500px at 85% -10%, color-mix(in srgb,var(--gold) 22%,transparent), transparent 60%),
     radial-gradient(700px 500px at 0% 110%, color-mix(in srgb,var(--blue) 26%,transparent), transparent 55%),
     linear-gradient(180deg,var(--cream),var(--cream-2))}
  .auth{width:100%;max-width:410px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:30px 26px 24px}
  .mark{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:grid;place-items:center;font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:27px;color:#fff;margin:0 auto 14px;box-shadow:0 10px 24px -10px var(--gold-deep)}
  .auth h1{font-weight:900;font-size:25px;text-align:center;margin-bottom:5px}
  .auth .tag{text-align:center;color:var(--ink-500);font-size:14px;margin:0 auto 20px;max-width:32ch}
  .tabs{display:flex;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:18px}
  .tabs button{flex:1;border:0;background:none;font:inherit;font-weight:700;font-size:14px;color:var(--ink-500);padding:9px;border-radius:999px;cursor:pointer;min-height:40px}
  .tabs button.on{background:var(--surface);color:var(--gold-deep);box-shadow:var(--shadow)}
  .fld{margin-bottom:13px}
  .auth .btn.primary{width:100%;margin-top:6px}
  .auth-foot{text-align:center;margin-top:18px;font-size:12px;color:var(--ink-300)}
  .msg{font-size:13.5px;border-radius:var(--radius-sm);padding:10px 13px;margin-top:13px}
  .msg.err{background:var(--rose-bg);color:var(--rose)}.msg.ok{background:var(--green-bg);color:var(--green)}

  /* APP SHELL */
  .shell{display:flex;min-height:100dvh}
  .side{width:234px;flex-shrink:0;background:linear-gradient(170deg,var(--navy),var(--navy-2));color:#fff;padding:20px 16px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:6px}
  .side .brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px}
  .side .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:grid;place-items:center;font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:18px;color:#fff;flex-shrink:0}
  .side .brand b{font-size:15.5px;font-weight:800;font-family:'Heebo';display:block;line-height:1.15}
  .side .brand span{font-size:11px;color:rgba(255,255,255,.55)}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
  .nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:rgba(255,255,255,.78);font:inherit;font-size:14px;font-weight:600;text-align:right;padding:11px 12px;border-radius:11px;cursor:pointer;width:100%}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.on{background:rgba(255,255,255,.14);color:#fff}
  .nav .ico{width:20px;text-align:center}
  .side .foot{margin-top:auto;font-size:12px;color:rgba(255,255,255,.6)}
  .side .foot .u{color:#fff;font-weight:600;font-size:13px;margin-bottom:8px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .foot button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:12.5px;cursor:pointer;width:100%}

  main{flex:1;min-width:0;padding:24px 20px 90px;max-width:1040px;margin:0 auto;width:100%}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .pagehead h1{font-size:26px;font-weight:900}
  .pagehead .sub{color:var(--ink-500);font-size:13.5px;margin-top:3px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .stat b{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:27px;line-height:1;display:block}
  .stat.total b{color:var(--gold-deep)}.stat.ready b{color:var(--amber)}.stat.sent b{color:var(--green)}.stat.need b{color:var(--ink-300)}
  .stat span{font-size:12.5px;color:var(--ink-500);margin-top:6px;display:block}

  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-500);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:38px}
  .chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep)}
  .filters select{width:auto;min-width:150px;padding:8px 12px;min-height:38px}
  .filters .grow{flex:1}

  .cat{margin-bottom:24px}
  .cathead{font-weight:900;font-size:17px;display:flex;align-items:center;gap:9px;border-bottom:2px solid var(--gold-soft);padding-bottom:7px;margin-bottom:13px}
  .catcount{font-family:'Heebo';font-size:12px;font-weight:700;color:var(--gold-deep);background:var(--gold-soft);border-radius:999px;padding:2px 10px}
  .cards{display:grid;gap:13px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
  .card.sent{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
  .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 11px;white-space:nowrap}
  .badge.new{background:var(--cream);color:var(--ink-500);border:1px solid var(--line)}
  .badge.ready{background:var(--amber-bg);color:var(--amber)}.badge.sent{background:var(--green-bg);color:var(--green)}
  .card h3{font-size:17px;font-weight:800;margin:8px 0 2px;font-family:'Heebo'}
  .meta{font-size:12.5px;color:var(--ink-500)}
  .pill{display:inline-block;font-size:11px;font-weight:700;color:var(--blue);background:color-mix(in srgb,var(--blue) 18%,transparent);border-radius:999px;padding:2px 9px;margin-inline-start:6px}
  .why{font-size:12.5px;background:var(--cream);border-radius:var(--radius-sm);padding:9px 12px;margin-top:10px;color:var(--ink-500)}.why b{color:var(--ink)}
  .fieldwrap{margin-top:11px}.fieldwrap label{font-size:11.5px;color:var(--ink-300)}
  .noemail{font-size:11.5px;color:var(--amber);margin-top:4px}
  .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
  .spacer{flex:1}
  .link{background:none;border:0;color:var(--gold-deep);font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:none}
  .del{background:none;border:0;color:var(--rose);font-weight:700;font-size:12.5px;cursor:pointer}
  .sentline{font-size:12.5px;color:var(--green);font-weight:700;margin-top:11px}
  .cardmsg{font-size:12.5px;margin-top:9px;border-radius:10px;padding:8px 11px}
  .cardmsg.err{background:var(--rose-bg);color:var(--rose)}.cardmsg.ok{background:var(--green-bg);color:var(--green)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
  .panel h2{font-size:19px;font-weight:900;margin-bottom:4px}
  .panel .sub{color:var(--ink-500);font-size:13px;margin-bottom:16px}
  .tmpl{background:var(--cream);border:1px dashed var(--line);border-radius:var(--radius-sm);padding:14px;font-size:13.5px;white-space:pre-wrap;line-height:1.7;max-height:260px;overflow:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .empty{text-align:center;color:var(--ink-500);padding:40px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
  .empty .big{font-size:30px;display:block;margin-bottom:8px}
  .loading{text-align:center;color:var(--ink-500);padding:70px 20px}
  .toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:fit-content;max-width:90vw;background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(10px);transition:all .25s;z-index:60}
  .toast.show{opacity:1;transform:none}
  dialog{border:0;border-radius:var(--radius);padding:0;box-shadow:var(--shadow-lg);max-width:460px;width:92vw;background:var(--surface);color:var(--ink)}
  dialog::backdrop{background:rgba(32,40,63,.5);backdrop-filter:blur(2px)}
  .dlg{padding:22px}.dlg h3{font-weight:900;font-size:20px;margin-bottom:14px}

  /* mobile */
  .mtop{display:none}
  @media(max-width:900px){
    .side{display:none}
    .shell{flex-direction:column}
    .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;padding:13px 16px;position:sticky;top:0;z-index:30}
    .mtop .brand{display:flex;align-items:center;gap:10px}
    .mtop .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:grid;place-items:center;font-family:'Frank Ruhl Libre',serif;font-weight:900;color:#fff}
    .mtop b{font-size:15px;font-weight:800}
    .mtop button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:12.5px;cursor:pointer}
    .mnav{display:flex;gap:6px;overflow:auto;padding:12px 16px 0}
    .mnav button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink-500);border-radius:999px;padding:8px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:38px}
    .mnav button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep)}
    main{padding:18px 16px 90px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="root"><div class="loading">טוען…</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";
  var TKEY="cm_app_token", NKEY="cm_app_name";
  var token=null, fullName="", profile=null, template=null, leads=[], stats={},
      draft={}, cardMsg={}, authTab="login", view="leads", fCat="all", fRegion="all";
  try{ token=localStorage.getItem(TKEY); fullName=localStorage.getItem(NKEY)||""; }catch(e){}
  var root=document.getElementById("root");
  var EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
  function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000)}

  function api(path,opts){
    opts=opts||{};
    var h=opts.headers||{}; h["Content-Type"]="application/json"; if(token) h["X-Auth-Token"]=token;
    return fetch(path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
      .then(function(r){ if(r.status===401){logout();throw{handled:true};} return r.json().then(function(j){if(!r.ok)throw(j||{error:"שגיאה"});return j;}); });
  }

  // ---------- AUTH ----------
  function renderAuth(err){
    root.innerHTML=
      '<div class="authwrap"><div class="auth">'+
        '<div class="mark">S</div>'+
        '<h1>מערכת הלידים שלך</h1>'+
        '<p class="tag">נרשמים, עונים על כמה שאלות על העסק — והמערכת בונה לכם מיילים ומרכזת לידים. במקום אחד.</p>'+
        '<div class="tabs"><button data-tab="login" class="'+(authTab==="login"?"on":"")+'">כניסה</button>'+
        '<button data-tab="signup" class="'+(authTab==="signup"?"on":"")+'">הרשמה</button></div>'+
        (authTab==="signup"?'<div class="fld"><label>שם מלא</label><input id="a_name" autocomplete="name"></div>':'')+
        '<div class="fld"><label>אימייל</label><input id="a_email" dir="ltr" type="email" autocomplete="email"></div>'+
        '<div class="fld"><label>סיסמה</label><input id="a_pass" type="password" autocomplete="'+(authTab==="login"?"current-password":"new-password")+'"></div>'+
        '<button class="btn primary" id="a_go">'+(authTab==="login"?"כניסה למערכת":"יצירת חשבון")+'</button>'+
        (err?'<div class="msg err">'+esc(err)+'</div>':'')+
        '<div class="auth-foot">מערכת לידים · הפצה חכמה</div>'+
      '</div></div>';
  }
  function doAuth(){
    var email=(document.getElementById("a_email").value||"").trim();
    var pass=document.getElementById("a_pass").value||"";
    var name=authTab==="signup"?((document.getElementById("a_name")||{}).value||"").trim():"";
    if(!EMAIL_RE.test(email)) return renderAuth("כתובת אימייל לא תקינה");
    if(pass.length<6) return renderAuth("סיסמה — לפחות 6 תווים");
    if(authTab==="signup"&&name.length<2) return renderAuth("נא למלא שם מלא");
    var btn=document.getElementById("a_go"); btn.disabled=true; btn.textContent="רגע…";
    var path=authTab==="login"?"/api/auth/login":"/api/auth/register";
    var body=authTab==="login"?{email:email,password:pass}:{email:email,password:pass,fullName:name};
    fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
      .then(function(res){
        if(!res.ok){renderAuth(res.j&&res.j.error||"שגיאה, נסי שוב");return;}
        if(res.j.needsOtp){renderAuth("החשבון דורש אימות טלפון.");return;}
        token=res.j.token; fullName=res.j.fullName||name||"";
        try{localStorage.setItem(TKEY,token);localStorage.setItem(NKEY,fullName);}catch(e){}
        loadAll();
      })
      .catch(function(){renderAuth("תקלת רשת — נסי שוב");});
  }
  function logout(){token=null;try{localStorage.removeItem(TKEY);localStorage.removeItem(NKEY);}catch(e){}leads=[];profile=null;renderAuth();}

  // ---------- LOAD ----------
  function loadAll(){
    root.innerHTML='<div class="loading">טוען…</div>';
    Promise.all([api("/api/app/profile"),api("/api/app/leads")])
      .then(function(res){
        profile=res[0].profile||null; template=res[0].template||null;
        leads=res[1].leads||[]; stats=res[1].stats||{};
        if(!profile||!profile.onboarded){ renderOnboard(); } else { view="leads"; renderApp(); }
      })
      .catch(function(e){ if(e&&e.handled)return; root.innerHTML='<div class="loading">תקלה בטעינה. <button class="link" onclick="location.reload()">נסי שוב</button></div>'; });
  }

  // ---------- ONBOARDING (business questionnaire) ----------
  function renderOnboard(){
    var p=profile||{};
    root.innerHTML=
      '<div class="authwrap"><div class="auth" style="max-width:560px">'+
        '<div class="mark">1</div>'+
        '<h1>בוא נכיר את העסק שלך</h1>'+
        '<p class="tag">כמה שאלות קצרות — ומתוכן המערכת בונה לך את נוסח הפנייה ומרכזת לידים בתחום שלך.</p>'+
        '<div class="fld"><label>שם העסק *</label><input id="o_biz" value="'+esc(p.businessName||"")+'" placeholder="לדוגמה: Segev Marketing"></div>'+
        '<div class="fld"><label>התחום שלך</label><input id="o_field" value="'+esc(p.field||"")+'" placeholder="מלונות / קליניקות / ציוד רפואי / נדל״ן…"></div>'+
        '<div class="fld"><label>מי קהל היעד שלך? (את מי לחפש)</label><input id="o_aud" value="'+esc(p.audience||"")+'" placeholder="מנהלי מלונות בישראל / מרפאות פרטיות…"></div>'+
        '<div class="fld"><label>מה אתה מציע להם? (המוצר/השירות)</label><textarea id="o_offer" style="min-height:90px" placeholder="סוכן AI שעונה ללידים 24/7 + מערכת לידים מלאה…">'+esc(p.offer||"")+'</textarea></div>'+
        '<div class="grid2">'+
          '<div class="fld"><label>המטרה העיקרית</label><input id="o_goal" value="'+esc(p.goal||"")+'" placeholder="להגדיל פניות / לסגור יותר"></div>'+
          '<div class="fld"><label>טון הפנייה</label><select id="o_tone">'+
            ['חם ואישי','מקצועי','ישיר וקצר','אנרגטי'].map(function(t){return '<option'+((p.tone===t)?' selected':'')+'>'+t+'</option>'}).join("")+
          '</select></div>'+
        '</div>'+
        '<div class="fld"><label>חתימה / פרטי קשר (שורה אחת)</label><input id="o_contact" value="'+esc(p.contact||"")+'" placeholder="קטי שגב · 054-0000000 · לינקדאין"></div>'+
        '<button class="btn primary" id="o_go" style="width:100%;margin-top:6px">בנה לי את המערכת →</button>'+
        '<div id="o_msg"></div>'+
        (profile&&profile.onboarded?'<div class="auth-foot"><button class="link" id="o_cancel">חזרה</button></div>':'')+
      '</div></div>';
  }
  function submitOnboard(){
    var data={
      businessName:(document.getElementById("o_biz").value||"").trim(),
      field:(document.getElementById("o_field").value||"").trim(),
      audience:(document.getElementById("o_aud").value||"").trim(),
      offer:(document.getElementById("o_offer").value||"").trim(),
      goal:(document.getElementById("o_goal").value||"").trim(),
      tone:(document.getElementById("o_tone").value||"").trim(),
      contact:(document.getElementById("o_contact").value||"").trim()
    };
    if(data.businessName.length<2){document.getElementById("o_msg").innerHTML='<div class="msg err">נא למלא שם עסק</div>';return;}
    var btn=document.getElementById("o_go"); btn.disabled=true; btn.textContent="בונה…";
    api("/api/app/profile",{method:"PUT",body:data}).then(function(j){
      profile=j.profile; template=j.template; view="leads"; renderApp(); toast("המערכת מוכנה ✓");
    }).catch(function(e){ if(e&&e.handled)return; btn.disabled=false; btn.textContent="בנה לי את המערכת →"; document.getElementById("o_msg").innerHTML='<div class="msg err">'+esc((e&&e.error)||"שגיאה")+'</div>'; });
  }

  // ---------- APP ----------
  var NAV=[["leads","🎯","הלידים שלי"],["template","✉️","נוסח הפנייה"],["profile","🏢","פרטי העסק"]];
  function renderApp(){
    var biz=(profile&&profile.businessName)||"העסק שלי";
    var side='<div class="side"><div class="brand"><span class="logo">S</span><span><b>'+esc(biz)+'</b><span>מערכת לידים</span></span></div>'+
      '<div class="nav">'+NAV.map(function(n){return '<button data-view="'+n[0]+'" class="'+(view===n[0]?"on":"")+'"><span class="ico">'+n[1]+'</span>'+n[2]+'</button>'}).join("")+'</div>'+
      '<div class="foot"><span class="u">'+esc(fullName||"")+'</span><button id="logout">יציאה</button></div></div>';
    var mtop='<div class="mtop"><div class="brand"><span class="logo">S</span><b>'+esc(biz)+'</b></div><button id="logout2">יציאה</button></div>'+
      '<div class="mnav">'+NAV.map(function(n){return '<button data-view="'+n[0]+'" class="'+(view===n[0]?"on":"")+'">'+n[1]+' '+n[2]+'</button>'}).join("")+'</div>';
    var body = view==="profile" ? profileView() : view==="template" ? templateView() : leadsView();
    root.innerHTML='<div class="shell">'+side+'<div style="flex:1;min-width:0">'+mtop+'<main>'+body+'</main></div></div>';
  }

  function leadsView(){
    var s=stats||{};
    var statCells=[["total","total",s.total||0,"פניות"],["ready","ready",s.ready||0,"מוכנות לשליחה"],["need","need",s.needEmail||0,"חסר מייל"],["sent","sent",s.sent||0,"נשלחו"]];
    // categories + regions for filters
    var catSet=[], regSet=[];
    leads.forEach(function(l){ var c=l.category||"כללי"; if(catSet.indexOf(c)<0)catSet.push(c); if(l.region&&regSet.indexOf(l.region)<0)regSet.push(l.region); });
    var shown=leads.filter(function(l){ return (fCat==="all"||(l.category||"כללי")===fCat)&&(fRegion==="all"||l.region===fRegion); });
    var cards;
    if(!shown.length){ cards='<div class="empty"><span class="big">🎯</span>אין פניות בתצוגה הזו. שַני סינון או הוסיפי פנייה.</div>'; }
    else{
      var groups={},order=[];
      shown.forEach(function(l){var c=l.category||"כללי";if(!groups[c]){groups[c]=[];order.push(c);}groups[c].push(l);});
      cards=order.map(function(cat){return '<div class="cat"><div class="cathead">'+esc(cat)+'<span class="catcount">'+groups[cat].length+'</span></div><div class="cards">'+groups[cat].map(cardHtml).join("")+'</div></div>';}).join("");
    }
    var catChips='<button class="chip '+(fCat==="all"?"on":"")+'" data-cat="all">הכל</button>'+catSet.map(function(c){return '<button class="chip '+(fCat===c?"on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';}).join("");
    var regSel='<select id="regSel"><option value="all">כל האזורים</option>'+regSet.map(function(r){return '<option value="'+esc(r)+'"'+(fRegion===r?' selected':'')+'>'+esc(r)+'</option>';}).join("")+'</select>';
    return '<div class="pagehead"><div><h1>הלידים שלי</h1><div class="sub">ערכי את הנוסח, הכניסי כתובת מייל — ושלחי. כל פנייה נשמרת אצלך בלבד.</div></div><button class="btn primary" id="addBtn">+ פנייה חדשה</button></div>'+
      '<div class="stats">'+statCells.map(function(c){return '<div class="stat '+c[1]+'"><b>'+c[2]+'</b><span>'+c[3]+'</span></div>'}).join("")+'</div>'+
      '<div class="filters">'+catChips+'<div class="grow"></div>'+regSel+'</div>'+
      cards;
  }

  function cardHtml(l){
    var sent=l.status==="sent";
    var email=val(l,"email"),subject=val(l,"subject"),body=val(l,"body");
    var badge=sent?'<span class="badge sent">נשלח ✓</span>':(email?'<span class="badge ready">מוכן לשליחה</span>':'<span class="badge new">חסר מייל</span>');
    var cm=cardMsg[l.id];
    return '<div class="card'+(sent?' sent':'')+'" data-card="'+l.id+'">'+
      '<div class="row1"><div>'+badge+'<h3>'+esc(l.name)+(l.region?'<span class="pill">'+esc(l.region)+'</span>':'')+'</h3><div class="meta">'+esc(l.type||"")+'</div></div></div>'+
      (l.why?'<div class="why"><b>למה שיגיד כן:</b> '+esc(l.why)+'</div>':'')+
      (sent?'<div class="sentline">נשלח אל '+esc(email)+'</div>'
        :'<div class="fieldwrap"><label>אל (מייל)</label><input dir="ltr" type="email" data-f="email" placeholder="כתובת מייל" value="'+esc(email)+'">'+(email?'':'<div class="noemail">אין עדיין מייל — אפשר להדביק ידנית.</div>')+'</div>'+
         '<div class="fieldwrap"><label>נושא</label><input data-f="subject" value="'+esc(subject)+'"></div>'+
         '<div class="fieldwrap"><label>הודעה</label><textarea data-f="body">'+esc(body)+'</textarea></div>')+
      (cm?'<div class="cardmsg '+cm.type+'">'+esc(cm.text)+'</div>':'')+
      '<div class="actions">'+
        (sent?'':'<button class="btn primary sm" data-act="send" data-id="'+l.id+'">📤 שלח מייל</button><button class="btn ghost sm" data-act="save" data-id="'+l.id+'">שמירה</button>')+
        (l.sourceUrl?'<a class="link" href="'+esc(l.sourceUrl)+'" target="_blank" rel="noopener">אתר ↗</a>':'')+
        '<div class="spacer"></div><button class="del" data-act="del" data-id="'+l.id+'">מחיקה</button>'+
      '</div></div>';
  }

  function templateView(){
    var t=template||{subject:"",body:""};
    return '<div class="pagehead"><div><h1>נוסח הפנייה שלך</h1><div class="sub">הבסיס לכל פנייה חדשה. ערכי ושמרי — או השאירי את מה שהמערכת בנתה מפרטי העסק.</div></div></div>'+
      '<div class="panel">'+
        '<div class="fieldwrap"><label>נושא המייל</label><input id="tpl_subject" value="'+esc(t.subject||"")+'"></div>'+
        '<div class="fieldwrap"><label>גוף הפנייה — רקע ההצעה + המסר</label><textarea id="tpl_body" style="min-height:230px">'+esc(t.body||"")+'</textarea></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn primary sm" id="saveTpl">💾 שמור נוסח</button><button class="btn ghost sm" id="resetTpl">אפס לברירת מחדל</button><button class="btn ghost sm" data-view="profile">פרטי העסק →</button></div>'+
        '<div class="sub" style="margin-top:12px">טיפ: השאירי «[שם הגוף]» במקום בו ייכנס שם הנמען — זה יוחלף אוטומטית בכל פנייה חדשה.</div>'+
      '</div>';
  }

  function profileView(){
    var p=profile||{};
    function row(k,v){return '<div class="fieldwrap"><label>'+k+'</label><div style="font-weight:600">'+esc(v||"—")+'</div></div>';}
    return '<div class="pagehead"><div><h1>פרטי העסק</h1><div class="sub">מתוך אלה המערכת בונה את הנוסח ומחפשת לידים בתחום שלך.</div></div><button class="btn primary" id="editProfile">עריכה</button></div>'+
      '<div class="panel">'+row("שם העסק",p.businessName)+row("תחום",p.field)+row("קהל יעד",p.audience)+row("מה מציעים",p.offer)+row("מטרה",p.goal)+row("טון",p.tone)+row("חתימה",p.contact)+'</div>';
  }

  // ---------- lead helpers ----------
  function val(l,f){ if(draft[l.id]&&draft[l.id][f]!=null) return draft[l.id][f]; return l[f]||""; }
  function cardVals(id){var c=document.querySelector('[data-card="'+id+'"]');if(!c)return null;var e=c.querySelector("[data-f=email]"),s=c.querySelector("[data-f=subject]"),b=c.querySelector("[data-f=body]");return{email:(e?e.value:"").trim(),subject:(s?s.value:"").trim(),body:(b?b.value:"")};}
  function flush(){document.querySelectorAll("[data-card]").forEach(function(c){var id=c.getAttribute("data-card");var v=cardVals(id);if(v)draft[id]=v;});}
  function byId(id){return leads.find(function(l){return l.id===id});}
  function saveLead(id,quiet){var v=cardVals(id);if(!v)return Promise.resolve();draft[id]=v;return api("/api/app/leads/"+id,{method:"PUT",body:v}).then(function(j){var i=leads.findIndex(function(l){return l.id===id});if(i>=0&&j.lead)leads[i]=j.lead;delete draft[id];if(!quiet)toast("נשמר ✓");}).catch(function(e){if(!(e&&e.handled)&&!quiet)toast("לא נשמר");});}
  function sendLead(id){
    var v=cardVals(id);if(!v)return;
    if(!EMAIL_RE.test(v.email)){cardMsg[id]={type:"err",text:"כתובת מייל לא תקינה."};flush();renderApp();return;}
    if(!v.subject||!v.body){cardMsg[id]={type:"err",text:"צריך נושא והודעה."};flush();renderApp();return;}
    flush();
    var btn=document.querySelector('[data-act="send"][data-id="'+id+'"]');if(btn){btn.disabled=true;btn.textContent="שולח…";}
    api("/api/app/leads/"+id+"/send",{method:"POST",body:v}).then(function(){
      var i=leads.findIndex(function(l){return l.id===id});if(i>=0){leads[i].status="sent";leads[i].email=v.email;}
      delete cardMsg[id];delete draft[id];stats.sent=(stats.sent||0)+1;toast("המייל נשלח ✓");renderApp();
    }).catch(function(e){if(e&&e.handled)return;cardMsg[id]={type:"err",text:(e&&e.error)||"השליחה נכשלה"};flush();renderApp();});
  }

  // ---------- events ----------
  document.addEventListener("click",function(ev){
    var tab=ev.target.closest("[data-tab]"); if(tab){authTab=tab.getAttribute("data-tab");renderAuth();return;}
    if(ev.target.id==="a_go"){doAuth();return;}
    if(ev.target.id==="o_go"){submitOnboard();return;}
    if(ev.target.id==="o_cancel"){view="leads";renderApp();return;}
    if(ev.target.id==="logout"||ev.target.id==="logout2"){logout();return;}
    if(ev.target.id==="editProfile"){renderOnboard();return;}
    if(ev.target.id==="saveTpl"){saveTemplate();return;}
    if(ev.target.id==="resetTpl"){resetTemplate();return;}
    var nv=ev.target.closest("[data-view]"); if(nv){view=nv.getAttribute("data-view");renderApp();return;}
    if(ev.target.id==="addBtn"){openAdd();return;}
    var ch=ev.target.closest("[data-cat]"); if(ch){flush();fCat=ch.getAttribute("data-cat");renderApp();return;}
    var b=ev.target.closest("[data-act]"); if(!b)return;
    var act=b.getAttribute("data-act"),id=b.getAttribute("data-id");
    if(act==="send")sendLead(id);
    else if(act==="save")saveLead(id,false);
    else if(act==="del"){var l=byId(id);if(l&&confirm("למחוק את \""+l.name+"\"?")){api("/api/app/leads/"+id,{method:"DELETE"}).then(function(){leads=leads.filter(function(x){return x.id!==id});delete draft[id];renderApp();toast("נמחק");}).catch(function(e){if(!(e&&e.handled))toast("לא נמחק");});}}
  });
  document.addEventListener("change",function(ev){ if(ev.target.id==="regSel"){flush();fRegion=ev.target.value;renderApp();} });
  document.addEventListener("keydown",function(ev){ if(ev.key==="Enter"&&ev.target&&(ev.target.id==="a_pass"||ev.target.id==="a_email"))doAuth(); });

  function saveTemplate(){
    var subject=(document.getElementById("tpl_subject").value||"").trim();
    var body=(document.getElementById("tpl_body").value||"");
    api("/api/app/template",{method:"PUT",body:{subject:subject,body:body}})
      .then(function(j){template=j.template;toast("הנוסח נשמר ✓");})
      .catch(function(e){if(!(e&&e.handled))toast("לא נשמר");});
  }
  function resetTemplate(){
    api("/api/app/template",{method:"PUT",body:{subject:"",body:""}})
      .then(function(j){template=j.template;renderApp();toast("אופס לברירת מחדל ✓");})
      .catch(function(e){if(!(e&&e.handled))toast("לא נשמר");});
  }

  function openAdd(){
    var cats=[]; leads.forEach(function(l){var c=l.category||"";if(c&&cats.indexOf(c)<0)cats.push(c);});
    var defCat=(fCat&&fCat!=="all")?fCat:"";
    var dlg=document.createElement("dialog");
    dlg.innerHTML='<form method="dialog" class="dlg"><h3>פנייה / ליד חדש</h3>'+
      '<div class="fieldwrap"><label>קטגוריה (הסגמנט — למשל: מפיצים)</label><input id="n_cat" list="catlist" value="'+esc(defCat)+'" placeholder="בחרי קיימת או כתבי חדשה"><datalist id="catlist">'+cats.map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist></div>'+
      '<div class="fieldwrap"><label>שם הגוף *</label><input id="n_name" required></div>'+
      '<div class="fieldwrap"><label>סוג</label><input id="n_type" placeholder="מפיץ / מרפאה / מלון…"></div>'+
      '<div class="fieldwrap"><label>אזור</label><input id="n_region"></div>'+
      '<div class="fieldwrap"><label>מייל (אם ידוע)</label><input id="n_email" dir="ltr" type="email"></div>'+
      '<div class="fieldwrap"><label>למה שיגיד כן (רקע קצר)</label><textarea id="n_why" style="min-height:70px"></textarea></div>'+
      '<div style="display:flex;gap:8px;margin-top:16px"><button class="btn primary" value="ok">הוספה</button><button class="btn ghost" value="cancel" type="submit">ביטול</button></div></form>';
    document.body.appendChild(dlg);
    dlg.addEventListener("close",function(){document.body.removeChild(dlg);});
    dlg.querySelector("form").addEventListener("submit",function(e){
      if(e.submitter&&e.submitter.value!=="ok")return;
      e.preventDefault();
      var name=(dlg.querySelector("#n_name").value||"").trim();if(!name)return;
      var t=template||{subject:"פנייה",body:""};
      api("/api/app/leads",{method:"POST",body:{
        name:name,
        category:dlg.querySelector("#n_cat").value.trim(),
        type:dlg.querySelector("#n_type").value.trim(),
        region:dlg.querySelector("#n_region").value.trim(),
        email:dlg.querySelector("#n_email").value.trim(),
        why:dlg.querySelector("#n_why").value.trim(),
        subject:t.subject,
        body:(t.body||"").replace("[שם הגוף]",name)
      }})
        .then(function(j){if(j.lead)leads.push(j.lead);dlg.close();renderApp();toast("נוסף ✓");})
        .catch(function(err){if(!(err&&err.handled))toast("לא נוסף");});
    });
    dlg.showModal();
  }

  if(token) loadAll(); else renderAuth();
})();
</script>
</body>
</html>
